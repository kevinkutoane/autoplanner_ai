name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  analyze-and-test:
    name: Analyze, Test & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze lib test --fatal-infos

      - name: Run tests
        run: flutter test --coverage

      - name: Build APK (Debug Verification)
        run: flutter build apk --debug

      # Upload coverage report. Codecov upload is non-blocking optional telemetry
      # (governed by repository secret CODECOV_TOKEN if configured). Local test
      # coverage generation in the preceding step ('flutter test --coverage') is the
      # blocking quality gate.
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: kevinkutoane/autoplanner_ai
        continue-on-error: true
