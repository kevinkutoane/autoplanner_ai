name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  analyze-and-test:
    name: Analyze, Test & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.1'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib/core/bootstrap lib/services/scheduler_service.dart test/scheduler_service_test.dart test/scheduler_behavioral_test.dart lib/main.dart

      - name: Analyze
        run: flutter analyze lib test --fatal-infos

      - name: Run tests
        run: flutter test --coverage

      - name: Build APK (Debug Verification)
        run: flutter build apk --debug

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage/lcov.info
        continue-on-error: true
